name: Importar pacote EstudaTI

on:
  push:
    branches: [master]
    paths:
      - 'pacotes/*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Extrair codigo com verificacoes
        run: |
          python3 - <<'PY'
          import pathlib, zipfile, re, shutil
          root = pathlib.Path('.').resolve()
          incoming = sorted(pathlib.Path('pacotes').glob('*.zip'), key=lambda p: p.stat().st_mtime)
          if not incoming:
              raise SystemExit('Nenhum ZIP encontrado em pacotes/')
          path = incoming[-1]
          forbidden = [
              re.compile(r'(^|/)\.env(?:$|\.(?!example$))', re.I),
              re.compile(r'(^|/)(backups|node_modules|__pycache__|\.git|\.vercel)/', re.I),
              re.compile(r'(^|/)[^/]*\.sqlite3(?:-wal|-shm)?$', re.I),
              re.compile(r'(^|/)[^/]*\.pdf$', re.I),
              re.compile(r'(^|/)[^/]*\.(?:key|pem|p12|pfx)$', re.I)
          ]
          with zipfile.ZipFile(path) as archive:
              members = [item for item in archive.infolist() if not item.is_dir()]
              if len(members)>2000 or sum(item.file_size for item in members)>100_000_000:
                  raise SystemExit('Pacote ultrapassa limites de seguranca')
              count = 0
              for item in members:
                  name = item.filename.replace('\\','/')
                  if not name.startswith('EstudaTI/'):
                      continue
                  relative = name[len('EstudaTI/'):]
                  parts = pathlib.PurePosixPath(relative).parts
                  if not relative or relative.startswith('/') or '..' in parts:
                      continue
                  if any(rule.search(relative) for rule in forbidden):
                      continue
                  dest = (root/relative).resolve()
                  if not dest.is_relative_to(root):
                      continue
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  with archive.open(item) as src, dest.open('wb') as dst:
                      shutil.copyfileobj(src,dst)
                  count += 1
          if count<35:
              raise SystemExit(f'Pacote inesperado: {count} arquivos')
          print(f'Importados {count} arquivos')
          PY
      - name: Verificar API
        run: |
          python3 -m pip install -q -r api/requirements.txt pytest
          PYTHONPATH=api python3 -m pytest -q tests
      - name: Verificar frontend
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Registrar alteracoes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!pacotes/'
          if ! git diff --staged --quiet; then
            git commit -m "build: importar codigo EstudaTI do pacote"
            git push
          fi
