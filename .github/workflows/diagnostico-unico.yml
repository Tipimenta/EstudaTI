name: Diagnóstico único de produção do Estuda
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/diagnostico-unico.yml'
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Executar verificador de produção sem credenciais
        run: |
          set +e
          python scripts/verificar_producao.py > /tmp/estuda_verificador.txt 2>&1
          status=$?
          set -e
          printf "%s" "$status" > /tmp/estuda_verificador_exitcode
      - name: Registrar respostas reais de health e resultado do verificador
        run: |
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          endpoints = [
              ("Render", "https://estudati-api.onrender.com/api/health"),
              ("Vercel", "https://estudati.vercel.app/api/health"),
          ]
          report = [
              "# Estuda — diagnóstico HTTP público (2026-11-12)",
              "",
              "Execução real em GitHub Actions, sem credenciais de usuário.",
              "Não utiliza variáveis do Neon, não faz login e não altera tabelas.",
              "",
          ]
          for label, url in endpoints:
              report += [f"## {label}: {url}", "", "```json"]
              try:
                  req = urllib.request.Request(url, headers={"Accept":"application/json"})
                  with urllib.request.urlopen(req, timeout=120) as result:
                      body = json.loads(result.read(250000).decode())
                      report.append(json.dumps({"http_status":result.status,**body},indent=2,ensure_ascii=False))
              except Exception as e:
                  report.append(json.dumps({"error":type(e).__name__+": "+str(e)},ensure_ascii=False))
              report += ["```", ""]
          report += [
              "## Saída de `python scripts/verificar_producao.py`",
              "",
              f"Código de saída: {Path('/tmp/estuda_verificador_exitcode').read_text()}",
              "",
              "```text",
              Path("/tmp/estuda_verificador.txt").read_text(errors="replace").strip(),
              "```",
              "",
              "## Autenticação",
              "O comando com `--email MEU_EMAIL` não foi executado: o argumento é",
              "um marcador, não uma conta, e a senha pessoal não foi fornecida.",
              "Para testar login, execute localmente e digite a senha no prompt.",
              "",
          ]
          out=Path("docs/RELATORIO_PRODUCAO_20261112.md")
          out.parent.mkdir(exist_ok=True)
          out.write_text("\n".join(report),encoding="utf-8")
          PY
      - name: Salvar relatório e remover este workflow temporário
        run: |
          git rm -f .github/workflows/diagnostico-unico.yml
          git add docs/RELATORIO_PRODUCAO_20261112.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(estuda): registrar health e verificação HTTP de produção"
          git push origin HEAD:master
