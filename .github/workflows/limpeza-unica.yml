name: Limpeza única e protegida do Estuda
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/limpeza-unica.yml'

permissions:
  contents: write

concurrency:
  group: estuda-limpeza-unica
  cancel-in-progress: false

jobs:
  limpar:
    name: Remover legados só após testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: '22'
      - name: Identificar imports e colocar apenas legados em staging
        run: python scripts/limpeza_legados.py
      - name: Instalar dependências API
        run: python -m pip install -q -r api/requirements-estuda.txt
      - name: Testes API em SQLite isolado
        working-directory: api
        env:
          DATABASE_URL: ''
          AI_PROVIDER: fake
          APP_SECRET: 'ci-only-secret-0000000000000000000000000000000000000000'
        run: python -m pytest -q testes_estuda
      - name: TypeScript e build React/Vite
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Publicar remoção validada e apagar este workflow temporário
        run: |
          git rm -f .github/workflows/limpeza-unica.yml scripts/limpeza_legados.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --stat
          git commit -m "chore(estuda): retirar somente código legado sem imports ativos"
          git push origin HEAD:master
