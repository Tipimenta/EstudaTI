name: Verificação final PDF textual
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/pdf-texto-unico.yml'
permissions:
  contents: write
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Dependências
        run: python -m pip install -q -r api/requirements-estuda.txt
      - name: Baixar PDF verdadeiro e extrair texto
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'api')
          from remote_pdf import download_public_pdf
          from importers import pdf_text
          url='https://mozilla.github.io/pdf.js/web/compressed.tracemonkey-pldi-09.pdf'
          lines=['','## Teste real de PDF com texto selecionável','','PDF público de demonstração do PDF.js (Mozilla): '+url,'']
          try:
              data=download_public_pdf(url)
              lines += [f'- Download público HTTPS: **OK** ({len(data)} bytes).']
              try:
                  text=pdf_text(data)
                  lines += [f'- Extração de texto: **OK** ({len(text)} caracteres).']
              except Exception as e:
                  lines += [f'- Extração de texto: **FALHOU** ({type(e).__name__}: {e}).']
          except Exception as e:
              lines += [f'- Download público HTTPS: **FALHOU** ({type(e).__name__}: {e}).']
          path=Path('docs/RELATORIO_PRODUCAO_20261112.md')
          with path.open('a',encoding='utf-8') as f:
              f.write('\n'.join(lines)+'\n')
          PY
      - name: Salvar relatório e retirar automação temporária
        run: |
          git rm -f .github/workflows/pdf-texto-unico.yml
          git add docs/RELATORIO_PRODUCAO_20261112.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(estuda): resultado de download e extração de PDF textual"
          git push origin HEAD:master
