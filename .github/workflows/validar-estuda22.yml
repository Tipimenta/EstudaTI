name: Validar Estuda 2.2
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements-estuda.txt
      - name: Dependências da API
        run: python -m pip install -r api/requirements-estuda.txt
      - name: Validar código e conteúdo sem acessar banco de produção
        run: |
          python -m compileall -q api scripts
          python scripts/auditar_conteudo.py --strict-structure
      - name: Testes de API com SQLite isolado
        working-directory: api
        env:
          DATABASE_URL: ""
          AI_PROVIDER: fake
          APP_SECRET: "ci-only-secret-0000000000000000000000000000000000000000"
        run: python -m pytest -q testes_estuda

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: '22'
      - name: Instalar dependências
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Validar TypeScript e produzir build
        working-directory: web
        run: npm run build
