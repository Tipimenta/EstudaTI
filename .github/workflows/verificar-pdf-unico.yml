name: Diagnóstico final HTTPS/PDF do Estuda
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/verificar-pdf-unico.yml'
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Instalar dependências para validar PDF por HTTPS
        run: python -m pip install -q -r api/requirements-estuda.txt
      - name: Smoke test de PDF remoto e diagnóstico de produção
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          from datetime import datetime, timezone
          p=Path('docs/RELATORIO_PRODUCAO_20261112.md')
          original=p.read_text(encoding='utf-8')
          sys.path.insert(0, 'api')
          results=['','## Validação final do downloader de PDF público',
                   f'Executado: {datetime.now(timezone.utc).isoformat()}',
                   '','PDF de teste: https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf']
          try:
              from remote_pdf import download_public_pdf
              from importers import pdf_text
              blob=download_public_pdf('https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf')
              content=pdf_text(blob)
              assert len(blob)>0 and len(content.strip())>=50
              results+=['',f'**PASSOU**: HTTP HTTPS público; {len(blob)} bytes; {len(content)} caracteres de texto extraído.']
          except Exception as e:
              results+=['',f'**NÃO CONFIRMADO**: {type(e).__name__}: {str(e)[:300]}']
          p.write_text(original+'\n'+'\n'.join(results)+'\n', encoding='utf-8')
          PY
          set +e
          python scripts/verificar_producao.py > /tmp/resultado-final.txt 2>&1
          status=$?
          set -e
          python - <<'PY'
          from pathlib import Path
          path=Path('docs/RELATORIO_PRODUCAO_20261112.md')
          path.write_text(path.read_text()+'\n## Verificação final pós-publicação (sem login)\n\n```text\n'+Path('/tmp/resultado-final.txt').read_text(errors='replace')+'\n```\n', encoding='utf-8')
          PY
      - name: Guardar resultado e autodesativar
        run: |
          git rm -f .github/workflows/verificar-pdf-unico.yml
          git add docs/RELATORIO_PRODUCAO_20261112.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(estuda): validação externa de download de PDF e saúde"
          git push origin HEAD:master
