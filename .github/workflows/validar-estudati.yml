name: Validar EstudaTI

on:
  push:
    branches: [master]
    paths:
      - 'api/**'
      - 'web/**'
      - 'tests/**'
      - '.github/workflows/validar-estudati.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: API e testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Instalar dependencias
        run: python3 -m pip install -q -r api/requirements.txt pytest httpx2
      - name: Rodar testes
        run: PYTHONPATH=api python3 -m pytest -q tests
  frontend:
    name: Frontend React
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Instalar dependencias e compilar
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
