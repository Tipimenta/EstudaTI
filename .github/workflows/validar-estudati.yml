name: Validar EstudaTI

on:
  push:
    branches: [master]
    paths:
      - 'api/**'
      - 'web/**'
      - 'tests/**'
      - '.github/workflows/validar-estudati.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: API e testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Instalar dependencias
        run: python3 -m pip install -q -r api/requirements.txt pytest httpx
      - name: Rodar testes
        run: PYTHONPATH=api python3 -m pytest -q tests api/tests
  prova-real-diagnostico:
    name: Diagnostico FGV (sem persistencia)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      ESTUDATI_FGV_LIVE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Dependencias PDF
        run: python3 -m pip install -q -r api/requirements.txt pytest
      - name: Validar fonte real sem copiar questoes para logs
        run: PYTHONPATH=api python3 -m pytest -s -q api/tests/test_official_fgv_live.py

  frontend:
    name: Frontend React
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Instalar dependencias e compilar
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

  postgres:
    name: PostgreSQL - integracao isolada
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: estudati_test
          POSTGRES_DB: estudati_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estudati_test -d estudati_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      ESTUDATI_PG_TEST_URL: postgresql://estudati_test@127.0.0.1:5432/estudati_test
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Instalar dependencias
        run: python3 -m pip install -q -r api/requirements.txt pytest httpx
      - name: Testar inicializacao e persistencia
        run: PYTHONPATH=api python3 -m pytest -q tests/test_postgres_cloud.py
