# Rodar local com Docker:  docker compose up -d --build   ->  http://localhost:8000
services:
  estuda:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_PATH: /app/backend/data/estuda.sqlite3
    volumes:
      - dados:/app/backend/data
    restart: unless-stopped
volumes:
  dados:
