services:
  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/estudati.sqlite3
      APP_PASSWORD: ${APP_PASSWORD:?Configure APP_PASSWORD no .env}
      APP_SECRET: ${APP_SECRET:?Configure APP_SECRET no .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ENABLE_MONITOR: ${ENABLE_MONITOR:-true}
      APP_TIMEZONE: America/Sao_Paulo
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
    volumes:
      - estudati_data:/data
    networks: [internal]
  web:
    build: ./web
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8088}:80"
    networks: [internal]
networks:
  internal:
volumes:
  estudati_data:
