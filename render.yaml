# Publicação no Render (plano gratuito). O banco fica no Supabase ou Neon (gratuitos),
# porque o disco do plano gratuito do Render é apagado a cada deploy.
services:
  - type: web
    name: estuda
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: AI_PROVIDER
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ALLOW_SIGNUP
        value: "1"
